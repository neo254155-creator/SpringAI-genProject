services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: InterviewData
      POSTGRES_USER: ${DB_USER:-genproject}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-genproject}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d InterviewData"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
