spring.datasource.url=jdbc:h2:mem:genproject-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
document-search.embedding.enabled=false

# Fixtures do not consume provider quotas. Dedicated quota tests use small limits.
ai.quota.account-daily-requests=10000
ai.quota.global-daily-requests=10000
ai.quota.account-daily-characters=10000000
ai.quota.global-daily-characters=10000000
