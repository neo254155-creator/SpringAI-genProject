spring.application.name=genProject
server.port=${PORT:8080}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.chat.model=${GROQ_MODEL:openai/gpt-oss-120b}

spring.datasource.url=${DB_URL:${local.database.url:jdbc:postgresql://localhost:5432/InterviewData}}
spring.datasource.username=${DB_USER:${local.database.user:genproject}}
spring.datasource.password=${DB_PASSWORD:${local.database.password:genproject}}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Written by the local PostgreSQL setup script; contains machine-local credentials.
spring.config.import=optional:file:./.local/database.properties
