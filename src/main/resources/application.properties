spring.application.name=genProject


# Gemini embeddings: URL and model come from the Google API documentation.
# Set DOCUMENT_EMBEDDINGS_ENABLED=true and DOCUMENT_EMBEDDINGS_API_KEY in IntelliJ.
# The URL, model, and provider can also be overridden with the variables below.
document-search.embedding.enabled=${DOCUMENT_EMBEDDINGS_ENABLED:false}
document-search.embedding.provider=${DOCUMENT_EMBEDDINGS_PROVIDER:openai-compatible}
document-search.embedding.base-url=${DOCUMENT_EMBEDDINGS_URL:https://generativelanguage.googleapis.com/v1beta/openai}
document-search.embedding.model=${DOCUMENT_EMBEDDINGS_MODEL:gemini-embedding-001}
document-search.embedding.api-key=${DOCUMENT_EMBEDDINGS_API_KEY:}

server.port=${PORT:8080}
server.servlet.session.cookie.name=INTERVIE_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${GROQ_API_KEY:}
spring.ai.openai.chat.model=${GROQ_MODEL:openai/gpt-oss-120b}
# Free-tier protection: retry only when the learner explicitly asks again.
spring.ai.openai.max-retries=0
spring.ai.openai.chat.max-retries=0

spring.datasource.url=${DB_URL:jdbc:postgresql://ep-autumn-thunder-b4u64k28-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
spring.datasource.username=${DB_USER:neondb_owner}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Written by the local PostgreSQL setup script; contains machine-local credentials.
spring.config.import=optional:file:./.local/database.properties

spring.servlet.multipart.max-file-size=1MB

spring.servlet.multipart.max-request-size=2MB
