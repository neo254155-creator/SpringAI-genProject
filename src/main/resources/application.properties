spring.application.name=genProject


document-search.embedding.enabled=${DOCUMENT_EMBEDDINGS_ENABLED:false}
document-search.embedding.provider=${DOCUMENT_EMBEDDINGS_PROVIDER:openai-compatible}
document-search.embedding.base-url=
document-search.embedding.model=
document-search.embedding.api-key=${DOCUMENT_EMBEDDINGS_API_KEY:}

server.port=${PORT:8080}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${GROQ_API_KEY:}
spring.ai.openai.chat.model=openai/gpt-oss-120b

spring.datasource.url=jdbc:postgresql://ep-autumn-thunder-b4u64k28-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
spring.datasource.username=neondb_owner
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Written by the local PostgreSQL setup script; contains machine-local credentials.
spring.config.import=optional:file:./.local/database.properties

spring.servlet.multipart.max-file-size=1MB

spring.servlet.multipart.max-request-size=2MB
