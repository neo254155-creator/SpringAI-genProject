<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#090a11" /><meta name="description" content="Sign in to your private Intervie practice history." />
  <title>Sign in · Intervie</title>
  <link rel="icon" href="/ui/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/ui/design.css" /><link rel="stylesheet" href="/ui/auth.css" />
  <script type="module" src="/ui/auth.js"></script>
  <link rel="modulepreload" href="/ui/api-config.js" />
  <link rel="modulepreload" href="/ui/auth-client.js" />
  <link rel="modulepreload" href="/ui/retry-keys.js" />
</head>
<body><main class="auth-page"><a class="brand" href="/">intervie<span class="accent">.</span></a>
  <section class="panel auth-panel" aria-labelledby="auth-title">
    <h1 id="auth-title">Welcome back.</h1>
    <p id="auth-description">Sign in to your résumé interviews, study notes, and saved progress.</p>
    <form id="auth-form" class="auth-form">
      <label for="username">Username</label><input id="username" name="username" autocomplete="username" minlength="3" maxlength="40" pattern="[A-Za-z0-9][A-Za-z0-9._-]{2,39}" required />
      <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="72" required />
      <p id="password-help" class="tiny muted" hidden>Use 12 or more characters, up to 72 UTF-8 bytes. Username uses 3–40 letters, numbers, dots, underscores or hyphens.</p>
      <button id="submit-auth" class="btn" type="submit">Sign in</button>
    </form>
    <p id="auth-status" role="status" aria-live="polite"></p><p id="auth-error" class="error" role="alert" hidden></p>
    <button id="toggle-auth" class="btn secondary" type="button">Create an account</button>
    <a class="text-link" href="/privacy.html">How your data is stored</a>
  </section><noscript>Enable JavaScript to sign in.</noscript></main></body></html>
